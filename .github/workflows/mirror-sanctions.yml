name: Espejo de listas de sanciones

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mirror-sanctions
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar y comprimir fuentes a data/
        run: |
          set -uo pipefail
          mkdir -p data
          count=$(jq 'length' sanctions-sources.json)
          for i in $(seq 0 $((count - 1))); do
            id=$(jq -r ".[$i].lista_id" sanctions-sources.json)
            file=$(jq -r ".[$i].file" sanctions-sources.json)
            url=$(jq -r ".[$i].url" sanctions-sources.json)
            case "$url" in
              PENDIENTE*|null|"") echo "Saltando $id: url no configurada"; continue ;;
            esac
            echo "Descargando $id -> data/$file.gz"
            if curl -L --fail --silent --show-error --retry 3 --max-time 240 \
                 -A "pep-manager-mirror/1.0" -o "data/$file.tmp" "$url"; then
              if [ -s "data/$file.tmp" ]; then
                gzip -9 -nc "data/$file.tmp" > "data/$file.gz"
                rm -f "data/$file.tmp" "data/$file"
                echo "OK $id -> data/$file.gz ($(wc -c < "data/$file.gz") bytes)"
              else
                echo "::warning::$id vacío; se conserva la copia previa"; rm -f "data/$file.tmp"
              fi
            else
              echo "::warning::Falló $id ($url); se conserva la copia previa"; rm -f "data/$file.tmp"
            fi
          done

      - name: FBI (api.fbi.gov paginado) -> data/FBI.json.gz
        run: |
          set -uo pipefail
          mkdir -p data
          UA="pep-manager-mirror/1.0 (+https://github.com/jacobtanori-lab/pep-manager)"
          BASE="https://api.fbi.gov/wanted/v1/list"
          TMP="$(mktemp -d)"
          if ! curl -sS --fail --retry 3 --max-time 120 -A "$UA" "$BASE?page=1" -o "$TMP/p_1.json"; then
            echo "::warning::FBI pagina 1 fallo; se conserva la copia previa"; rm -rf "$TMP"; exit 0
          fi
          total=$(jq '.total // 0' "$TMP/p_1.json")
          per=$(jq '.items | length' "$TMP/p_1.json")
          if [ "$per" -eq 0 ]; then echo "::warning::FBI sin items; se conserva la copia previa"; rm -rf "$TMP"; exit 0; fi
          pages=$(( (total + per - 1) / per ))
          echo "FBI total=$total per=$per pages=$pages"
          for p in $(seq 2 "$pages"); do
            sleep 0.4
            curl -sS --fail --retry 3 --max-time 120 -A "$UA" "$BASE?page=$p" -o "$TMP/p_$p.json" \
              || echo "::warning::FBI pagina $p fallo"
          done
          jq -s '{items: ([.[].items[] | {uid,title,aliases,subjects,person_classification,status,nationality,possible_countries,dates_of_birth_used,publication,caution,reward_text,url,field_offices}] | sort_by(.uid // ""))}' "$TMP"/p_*.json > "$TMP/fbi.json"
          n=$(jq '.items | length' "$TMP/fbi.json")
          echo "FBI ensamblado: $n items"
          if [ "$n" -lt 500 ]; then
            echo "::warning::FBI solo $n (<500); se conserva la copia previa"; rm -rf "$TMP"; exit 0
          fi
          gzip -9 -nc "$TMP/fbi.json" > data/FBI.json.gz
          echo "OK FBI -> data/FBI.json.gz ($(wc -c < data/FBI.json.gz) bytes)"
          rm -rf "$TMP"

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "sanctions-mirror-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "chore: espejo de listas de sanciones ($(date -u +%F))"
            git push
          fi
